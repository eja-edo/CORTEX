[pytest]
testpaths = tests
python_files = test_*.py
asyncio_default_fixture_loop_scope = function
# Bộ eval gọi LLM thật (tốn tiền, chậm, và có thể đỏ vì model chứ không vì
# code). Không chạy trong `pytest` mặc định — bật bằng:
#     pytest -m live_llm tests/eval
markers =
    live_llm: chạm API model thật; deselect mặc định
addopts = -m "not live_llm"
