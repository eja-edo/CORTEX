# Bộ dữ liệu MẪU cho chạy thử local (dev.local setup). Toàn bộ là GIẢ LẬP: tên, giá, địa chỉ, chính sách
# không thuộc doanh nghiệp thật nào. Dùng làm khuôn khi thu dữ liệu của khách thật (bản thật để trong data/,
# không commit).
#
# Quy ước để validator (A7) xác minh được:
# - Con số khách sẽ nghe (giá, thời lượng, số buổi, %, phút, sĩ số) đặt ở trường SỐ riêng, không nhét vào câu chữ.
# - Trường chữ tránh chữ số, trừ giờ dạng hh:mm. Ngày khai giảng do setup điền (cách hôm nay N ngày) dạng dd/mm.
# - Chính sách viết dạng ĐƯỢC / KHÔNG ĐƯỢC cho từng trường hợp, không để suy ngược: AI đọc đúng từng chữ.
#   (Đã xảy ra: "từ buổi thứ ba không hoàn" -> AI nói học hai buổi vẫn được hoàn.)
# - Mục `thong_tin` (không có giá) là kiến thức chung: đăng ký, ưu đãi, hoàn phí, cơ sở, học online...
