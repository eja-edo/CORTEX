services:
  db:
    image: postgres:16-alpine
    container_name: cortex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cortex_db
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortex_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: cortex-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cortex.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  minio-cortex:
    image: minio/minio:latest
    container_name: minio-cortex
    restart: unless-stopped
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - E:/Cortex/infrastructure/minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - cortex
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Tạo bucket tự động khi khởi động

  minio-cortex-init:
    image: minio/mc:latest
    container_name: minio-cortex-init
    depends_on:
      minio-cortex:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio-cortex:9000 minioadmin minioadmin123;
      mc mb myminio/cortex-recordings --ignore-existing;

      # allow download
      mc anonymous set download myminio/cortex-recordings;

      # 🔥 auto delete after 7 days
      mc ilm rule add --expire-days 7 myminio/cortex-recordings;

      echo 'Bucket created + lifecycle rule added!';
      "
    networks:
      - cortex

volumes:
  postgres_data:
  pgadmin_data:

networks:
  cortex:
    driver: bridge
