# Sandbox owner_digest (WP19): the owner's numbers, made by a template. No LLM run, so no model fields matter yet;
# the profile exists so the sandbox is shaped like every other one (DESIGN §5.6) and G2.5 can add an LLM summary.
id: digest_template
version: 1
audience: owner
input_trust: trusted
context_sources: ["metadata:tenant"]  # counts from tables; never message text
tool_allowlist: []
effect_ceiling: internal
memory_scope: none
output_schema: Digest
model: none
max_tool_calls: 0
timeout_s: 30
token_budget: 0
