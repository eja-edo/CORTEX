{% extends "base.html" %}
{% block title %}Tạo kỹ năng — Cortex Leads{% endblock %}
{% block body %}<h1>{{ title }}</h1>
{% if errors %}<section class="card bad">{% for e in errors %}<p>{{ e }}</p>{% endfor %}</section>{% endif %}
<form method="post" action="/staff/skills/new" class="card"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="template" value="{{ template }}">
<label>Tên ngắn (chữ thường, số, gạch ngang)<br><input name="slug" required pattern="[a-z0-9][a-z0-9-]{2,29}" value="{{ v.slug or '' }}"></label>
<label>Mô tả một câu<br><input name="description" required minlength="10" maxlength="200" style="width:100%" value="{{ v.description or '' }}"></label>
{% if template == "khach_im" %}<label>Hỏi lại sau khi khách im (giờ)<br><input name="after_hours" type="number" min="4" max="72" value="{{ v.after_hours or 20 }}"></label>
<label>Chỉ với khách có ý định (để trống = mọi khách)<br><input name="intent" value="{{ v.intent or '' }}" placeholder="hoi_gia"></label>{% endif %}
<label>Số lần nhắn tối đa mỗi khách<br><input name="max_touches" type="number" min="1" max="3" value="{{ v.max_touches or 2 }}"></label>
<label>Cách làm của doanh nghiệp (viết như dặn một nhân viên mới)<br><textarea name="instructions" rows="6" required minlength="20">{{ v.instructions or '' }}</textarea></label>
<label>Cụm không được nói thêm (mỗi dòng một cụm)<br><textarea name="never_say" rows="3">{{ v.never_say or '' }}</textarea></label>
<label>Việc phải chuyển cho người thêm (mỗi dòng một việc)<br><textarea name="must_handoff" rows="2">{{ v.must_handoff or '' }}</textarea></label>
<details><summary>Ví dụ (không bắt buộc)</summary>
<label>Khách nói 1<br><input name="ex1_khach" style="width:100%" value="{{ v.ex1_khach or '' }}"></label>
<label>Nháp đúng ý 1<br><textarea name="ex1_tra_loi" rows="2">{{ v.ex1_tra_loi or '' }}</textarea></label>
<label>Khách nói 2<br><input name="ex2_khach" style="width:100%" value="{{ v.ex2_khach or '' }}"></label>
<label>Nháp đúng ý 2<br><textarea name="ex2_tra_loi" rows="2">{{ v.ex2_tra_loi or '' }}</textarea></label></details>
<button>Lưu bản nháp</button> <a href="/staff/skills">Huỷ</a></form>
{% endblock %}
