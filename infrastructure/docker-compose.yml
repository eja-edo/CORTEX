# Cortex — toàn bộ đường chính, chạy bằng Docker.
#
# **Mặc định dựng đúng 5 container:** `db`, `redis`, `backend`, `mezon_bot`,
# `web` (Caddy: file tĩnh + reverse proxy). Đó là mục tiêu vận hành ở
# `docs/DESIGN.md` mục 11.3, không phải một con số tình cờ. Mọi service khác
# nằm sau một `profiles:` và không khởi động nếu không được gọi tên — cơ chế
# đóng băng ở 11.2.
#
# Đóng băng không phải xoá: không dòng nào mất đi, và bật lại là một lệnh.
#
# **Tự lên sau khi mở máy:** mọi service đường chính mang
# `restart: unless-stopped`, và `docker.service` đã enabled ở boot. Nghĩa là
# một lần `up -d` là đủ cho mọi lần khởi động máy về sau. `unless-stopped`
# chứ không phải `always` là có chủ ý: dừng tay bằng `docker compose stop`
# thì nó phải ở yên đó, không sống dậy sau lần reboot kế tiếp.
#
#   http://localhost:5173   giao diện (Caddy, /api proxy về backend)
#   http://localhost:8000   API trực tiếp — Swagger, và callback OAuth Google
#
#   docker compose up -d                        # đường chính
#   docker compose --profile workflow up -d     # + Temporal + workflow_service
#   docker compose --profile assets   up -d     # + MinIO + Mongo (OCR/STT)
#   docker compose --profile search   up -d     # + searxng + unsearch
#   docker compose --profile all      up -d     # tất cả, như trước đây
#
# Điều kiện hồi sinh của từng profile nằm ở DESIGN 11.3 — mỗi mục có một
# điều kiện quan sát được, không phải "khi nào cần".

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cortex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cortex_db
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortex_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
      - cortex

  mongo:
    profiles: ["assets", "all"]
    image: mongo:7
    container_name: cortex-mongo
    restart: unless-stopped
    ports:
      - "27016:27017"
    command: mongod --wiredTigerCacheSizeGB 0.5
    volumes:
      - mongo_data:/data/db
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default
      - cortex

  redis:
    image: redis:7-alpine
    container_name: cortex-redis
    restart: unless-stopped
    ports:
      - "6377:6379"
    command: redis-server --appendonly yes --maxmemory 200mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    mem_limit: 256m
    cpus: 0.3
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - default
      - cortex

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cortex-backend
    restart: unless-stopped
    # Bí mật vẫn ở `backend/.env` như trước — không có bản sao thứ hai để
    # quên đồng bộ. `environment:` bên dưới chỉ ghi đè đúng những dòng nói
    # *chỗ nào*, vì trong mạng compose "localhost" là chính container này.
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://cortex:cortex@db:5432/cortex_db
      ASYNC_DATABASE_URL: postgresql+asyncpg://cortex:cortex@db:5432/cortex_db
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Cổng nội bộ của bot, không phải cổng publish — 8100 là cổng thật bên
      # trong mạng, và nó không ra tới host.
      MEZON_BOT_INTERNAL_URL: http://mezon_bot:8100
      # Hai dòng dưới trỏ tới service đang đóng băng (profile `assets`). Để
      # đúng tên service thay vì localhost để lúc bật `--profile assets` lên
      # nó chạy được ngay; khi chưa bật thì "không có gì ở đó" — y hệt hiện
      # trạng chạy trên host.
      MONGODB_URL: mongodb://mongo:27017
      MINIO_ENDPOINT: minio-cortex:9000
      # 9Router — gateway LLM chạy trên HOST, không phải trong compose
      # (trạng thái của nó ở ~/.9router, và nó có unit systemd riêng:
      # `systemctl --user status 9router`). `localhost` trong container là
      # chính container, nên phải đi vòng qua host-gateway. Đây là đường
      # sống của agent chat, trích xuất task và mọi lượt chat qua DM —
      # nhưng KHÔNG có healthcheck nào nhìn thấy nó: backend vẫn lên xanh
      # khi 9Router chết.
      OPENAI_BASE_URL: http://host.docker.internal:20128/v1
      # KHÔNG đặt UNSEARCH_URL ở đây, dù mặc định `localhost:8009` trong
      # config.py là sai bên trong container. Lý do: ba tool duy nhất đọc
      # nó (`web_search`, `neural_search`, `deep_research`) đều nằm trong
      # FROZEN_TOOLS, nên đây là cấu hình chết — và `unsearch-api:8000`
      # cũng KHÔNG phải giá trị đúng để điền sẵn: unsearch dựng
      # TrustedHostMiddleware chỉ nhận `localhost` và `*.unsearch.dev`
      # (`infrastructure/unsearch/app/main.py:164`), nên tên service trả
      # về 400 "Invalid host header". Lúc hồi sinh `--profile search` thì
      # phải sửa allowlist bên đó trước, không phải thêm một dòng ở đây.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Publish ra host vì Google gọi thẳng vào callback OAuth ở đây, và vì
      # Swagger là đường vào duy nhất để soi API bằng tay.
      - "8000:8000"
    mem_limit: 2g
    cpus: 2.0
    networks:
      - default
      - cortex

  mezon_bot:
    build:
      context: ../mezon_bot
      dockerfile: Dockerfile
    container_name: cortex-mezon-bot
    restart: unless-stopped
    env_file:
      - ../mezon_bot/.env
    environment:
      CORTEX_API_URL: http://backend:8000
      # 127.0.0.1 là mặc định của bot và nó đúng khi chạy trên host — trong
      # container thì đó là chỉ nghe chính mình, và backend gọi vào sẽ bị từ
      # chối kết nối.
      BOT_HOST: 0.0.0.0
      BOT_PORT: "8100"
      MINIO_ENDPOINT: minio-cortex:9000
    depends_on:
      backend:
        condition: service_started
    # Không publish 8100. Đường vào này mang INTERNAL_API_KEY, tức là hành
    # động được với tư cách bất kỳ user nào — nó chỉ nên tới được từ trong
    # mạng compose.
    mem_limit: 512m
    cpus: 0.5
    networks:
      - default
      - cortex

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: cortex-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:5173"
    mem_limit: 256m
    cpus: 0.5
    networks:
      - default
      - cortex

  minio-cortex:
    profiles: ["assets", "all"]
    image: minio/minio:latest
    container_name: minio-cortex
    restart: unless-stopped
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9001"
    mem_limit: 512m
    cpus: 0.5
    networks:
      - cortex
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-cortex-init:
    profiles: ["assets", "all"]
    image: minio/mc:latest
    container_name: minio-cortex-init
    depends_on:
      minio-cortex:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio-cortex:9000 minioadmin minioadmin123;
      mc mb myminio/cortex-recordings --ignore-existing;
      mc anonymous set download myminio/cortex-recordings;
      mc ilm rule add --expire-days 7 myminio/cortex-recordings;
      echo 'Bucket created + lifecycle rule added!';
      "
    mem_limit: 128m
    cpus: 0.1
    networks:
      - cortex

  unsearch-api:
    profiles: ["search", "all"]
    build:
      context: ./unsearch
    container_name: unsearch-api
    restart: unless-stopped
    ports:
      - "8009:8000"
    environment:
      ENVIRONMENT: production

      SEARXNG_URL: http://searxng:8080

      REDIS_URL: redis://redis:6379

      DATABASE_URL: postgresql://cortex:cortex@db:5432/cortex_db

      LOG_LEVEL: INFO
      WORKERS: 4

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

      searxng:
        condition: service_healthy

    volumes:
      - ./unsearch/logs:/app/logs

    networks:
      - cortex

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  searxng:
    profiles: ["search", "all"]
    image: searxng/searxng:latest
    container_name: cortex-searxng

    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET_KEY: ultrasecretkey

    volumes:
      - ./unsearch/searxng:/etc/searxng:rw

    networks:
      - cortex

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s

  # --- TEMPORAL STACK ---
  temporal-postgresql:
    profiles: ["workflow", "all"]
    image: postgres:13
    container_name: temporal-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    ports:
    - "5435:5432"
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cortex

  temporal:
    profiles: ["workflow", "all"]
    image: temporalio/auto-setup:1.29.7
    container_name: temporal
    restart: unless-stopped
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    mem_limit: 512m
    cpus: 0.5
    networks:
      - cortex

  temporal-ui:
    profiles: ["workflow", "all"]
    image: temporalio/ui:2.51.0
    container_name: temporal-ui
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8088:8080"
    mem_limit: 256m
    cpus: 0.3
    networks:
      - cortex

  # --- WORKFLOW SERVICE ---
  workflow_service:
    profiles: ["workflow", "all"]
    build:
      context: ../workflow_service
      dockerfile: Dockerfile
    container_name: workflow_service
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://cortex:cortex@db:5432/cortex_db
      - TEMPORAL_HOST=temporal:7233
      - CORTEX_BACKEND_URL=http://host.docker.internal:8000
      - CORTEX_INTERNAL_API_KEY=cortex-internal-key-2024
      - REDIS_URL=redis://redis:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"
    volumes:
      - ../workflow_service/app:/app/app
    mem_limit: 256m
    cpus: 0.3
    networks:
      - cortex

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  mongo_data:
  temporal-postgres-data:

networks:
  cortex:
    driver: bridge