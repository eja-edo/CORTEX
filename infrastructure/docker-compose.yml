services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cortex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cortex_db
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortex_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
      - cortex

  mongo:
    image: mongo:7
    container_name: cortex-mongo
    restart: unless-stopped
    ports:
      - "27016:27017"
    command: mongod --wiredTigerCacheSizeGB 0.5
    volumes:
      - mongo_data:/data/db
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default
      - cortex

  redis:
    image: redis:7-alpine
    container_name: cortex-redis
    restart: unless-stopped
    ports:
      - "6377:6379"
    command: redis-server --appendonly yes --maxmemory 200mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    mem_limit: 256m
    cpus: 0.3
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - default
      - cortex

  minio-cortex:
    image: minio/minio:latest
    container_name: minio-cortex
    restart: unless-stopped
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9001"
    mem_limit: 512m
    cpus: 0.5
    networks:
      - cortex
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-cortex-init:
    image: minio/mc:latest
    container_name: minio-cortex-init
    depends_on:
      minio-cortex:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio-cortex:9000 minioadmin minioadmin123;
      mc mb myminio/cortex-recordings --ignore-existing;
      mc anonymous set download myminio/cortex-recordings;
      mc ilm rule add --expire-days 7 myminio/cortex-recordings;
      echo 'Bucket created + lifecycle rule added!';
      "
    mem_limit: 128m
    cpus: 0.1
    networks:
      - cortex

  unsearch-api:
    build:
      context: ./unsearch
    container_name: unsearch-api
    restart: unless-stopped
    ports:
      - "8009:8000"
    environment:
      ENVIRONMENT: production

      SEARXNG_URL: http://searxng:8080

      REDIS_URL: redis://redis:6379

      DATABASE_URL: postgresql://cortex:cortex@db:5432/cortex_db

      LOG_LEVEL: INFO
      WORKERS: 4

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

      searxng:
        condition: service_healthy

    volumes:
      - ./unsearch/logs:/app/logs

    networks:
      - cortex

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  searxng:
    image: searxng/searxng:latest
    container_name: cortex-searxng

    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET_KEY: ultrasecretkey

    volumes:
      - ./unsearch/searxng:/etc/searxng:rw

    networks:
      - cortex

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  mongo_data:

networks:
  cortex:
    driver: bridge