services:
  db:
    image: postgres:16-alpine
    container_name: cortex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cortex_db
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortex_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: cortex-mongo
    restart: unless-stopped
    ports:
      - "27016:27017"
    command: mongod --wiredTigerCacheSizeGB 0.5
    volumes:
      - mongo_data:/data/db
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default
      - cortex

  redis:
    image: redis:7-alpine
    container_name: cortex-redis
    restart: unless-stopped
    ports:
      - "6377:6379"
    command: redis-server --appendonly yes --maxmemory 200mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    mem_limit: 256m
    cpus: 0.3
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - default
      - cortex

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: cortex-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cortex.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    mem_limit: 256m
    cpus: 0.2

  minio-cortex:
    image: minio/minio:latest
    container_name: minio-cortex
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - E:/Cortex/infrastructure/minio-data:/data
    command: server /data --console-address ":9001"
    mem_limit: 512m
    cpus: 0.5
    networks:
      - cortex
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-cortex-init:
    image: minio/mc:latest
    container_name: minio-cortex-init
    depends_on:
      minio-cortex:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio-cortex:9000 minioadmin minioadmin123;
      mc mb myminio/cortex-recordings --ignore-existing;
      mc anonymous set download myminio/cortex-recordings;
      mc ilm rule add --expire-days 7 myminio/cortex-recordings;
      echo 'Bucket created + lifecycle rule added!';
      "
    mem_limit: 128m
    cpus: 0.1
    networks:
      - cortex

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  mongo_data:

networks:
  cortex:
    driver: bridge