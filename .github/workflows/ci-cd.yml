name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ${{ secrets.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.CI_POSTGRES_DB }}
        ports:
          - 5434:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql+psycopg2://${{ secrets.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5434/${{ secrets.CI_POSTGRES_DB }}
      ASYNC_DATABASE_URL: postgresql+asyncpg://${{ secrets.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5434/${{ secrets.CI_POSTGRES_DB }}
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # Backend->backend auth for internal endpoints (task_ingest webhook).
      # Only needs to be non-empty and match what the tests read back from
      # settings — it's not a real production credential.
      INTERNAL_API_KEY: ${{ secrets.CI_INTERNAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run migrations
        run: python -m alembic upgrade head

      - name: Run tests
        # These 5 call the real embedding gateway (app/ai/agents/embedding_service.py,
        # OPENAI_BASE_URL) that only exists on the maintainer's own infra — not
        # reachable from a GitHub-hosted runner, so they fail on ConnectError here
        # regardless of code correctness. They're intentionally not under the
        # `live_llm` marker (that's for the paid model; this is a free internal
        # service assumed always-on in normal dev), so they're deselected here
        # instead of skipped via a marker.
        run: >-
          python -m pytest
          --deselect tests/integration/test_procedures.py::TestDefinition::test_trigger_is_embedded_separately_from_steps
          --deselect tests/integration/test_procedures.py::TestDefinition::test_any_phrase_can_match
          --deselect tests/integration/test_procedures.py::TestTriggerMatching::test_matches_the_situation_it_describes
          --deselect tests/integration/test_memory_recall.py::TestRecallReachesContext::test_matching_message_surfaces_the_memory
          --deselect tests/integration/test_memory_recall.py::TestRecallReachesContext::test_memory_reaches_the_system_prompt_string

  frontend:
    name: Frontend lint, build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/Cortex
            git fetch origin develop
            git reset --hard origin/develop
            cd infrastructure
            docker compose up -d --build
